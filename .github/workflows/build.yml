name: Build Windows Kernel Driver

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install WDK via Chocolatey
      run: choco install windowsdriverkit10 -y --execution-timeout=1800

    - name: Install WDK Visual Studio Extension
      run: |
        $vsixPath = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\Vsix\VS2022" -Filter "WDK.vsix" -Recurse | Select-Object -First 1 -ExpandProperty FullName
        Start-Process -FilePath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\VSIXInstaller.exe" -ArgumentList "/q /a /c /skuName:Enterprise /skuVol:17 `"$vsixPath`"" -Wait

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Driver
      run: msbuild rbxdriver.vcxproj /p:Configuration=Release /p:Platform=x64
      
    - name: Upload Driver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rbxdrv-release
        path: x64/Release/
