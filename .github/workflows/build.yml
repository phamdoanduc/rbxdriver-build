name: Build Windows Kernel Driver

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Download and Install WDK
      run: |
        Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2166289" -OutFile wdksetup.exe
        Start-Process -FilePath "wdksetup.exe" -ArgumentList "/q" -Wait
        
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Driver (rbxdriver)
      run: |
        msbuild rbxdriver.sln /p:Configuration=Release /p:Platform=x64
      
    - name: Upload Driver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rbxdrv.sys
        path: x64/Release/rbxdriver.sys
