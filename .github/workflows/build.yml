name: Build Windows Kernel Driver

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Driver (NuGet WDK)
      run: msbuild rbxdriver.vcxproj /p:Configuration=Release /p:Platform=x64 /restore
      
    - name: Upload Driver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rbxdrv-release
        path: x64/Release/
